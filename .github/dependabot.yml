# Dependabot: weekly, grouped, so reviewers see one PR per ecosystem instead of dozens.
# Security updates are not grouped away: GitHub opens those immediately regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace; one lockfile at the root
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    commit-message:
      prefix: deps
      include: scope
    labels: [dependencies]

  - package-ecosystem: github-actions # actions are pinned by commit SHA; Dependabot bumps SHA + version comment
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
