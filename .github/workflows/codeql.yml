# CodeQL static analysis for JavaScript/TypeScript (no build needed), on PRs, pushes to main and weekly.
# The security-extended suite adds queries beyond the default set; results land in the Security tab.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2" # Tuesdays 04:41 UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/dist/**"
              - "**/test/fixtures/**"

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"
