# CI for DegentClub/scribbit (the platform repo; ADR-0004).
# Structure gates (manifests, boundaries, catalog, CODEOWNERS) always run on the whole repo: they are
# cheap and a change anywhere can break them. Typecheck/test run on affected packages only for PRs
# (changed packages + their dependents, via pnpm's "...[origin/main]" filter) and on everything on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so "...[origin/main]" can diff against the base

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate component manifests
        run: pnpm validate

      - name: Enforce import boundaries
        run: pnpm lint:boundaries

      # flashy/public/** (the FlashyOS well-known files this repo publishes) is generated from
      # flashy/charter.json, frontdoor.config.json and directory.config.json by @bsh/mesh. A diff
      # after re-emitting means someone edited the output instead of its source.
      - name: FlashyOS well-known files are generated from their sources
        run: |
          pnpm mesh:emit
          git diff --exit-code -- flashy/

      - name: FlashyOS well-known files conform
        run: pnpm mesh:check

      - name: Catalog is up to date
        run: pnpm catalog --check

      - name: CODEOWNERS is up to date
        run: pnpm --filter @bsh/catalog-tool run codeowners --check -- --org DegentClub

      - name: No breaking OpenAPI changes (oasdiff)
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          status=0
          for f in $(git diff --name-only --diff-filter=M "$base"...HEAD -- 'contracts/openapi/*.yaml' 'contracts/openapi/*.yml' 'contracts/openapi/*.json'); do
            mkdir -p /tmp/base/$(dirname "$f")
            git show "$base:$f" > "/tmp/base/$f"
            echo "::group::oasdiff $f"
            docker run --rm -v /tmp/base:/base -v "$PWD":/head tufin/oasdiff breaking "/base/$f" "/head/$f" --fail-on ERR || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Typecheck (affected)
        if: github.event_name == 'pull_request'
        run: pnpm --filter "...[origin/${{ github.base_ref }}]" run --if-present typecheck

      - name: Test (affected)
        if: github.event_name == 'pull_request'
        run: pnpm --filter "...[origin/${{ github.base_ref }}]" run --if-present test

      - name: Typecheck (all)
        if: github.event_name != 'pull_request'
        run: pnpm typecheck

      - name: Test (all)
        if: github.event_name != 'pull_request'
        run: pnpm test
