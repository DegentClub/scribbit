# Developer Certificate of Origin: every non-merge commit in a PR must carry a
# "Signed-off-by: Name <email>" trailer whose email matches the commit author (`git commit -s`).
# Inline script, no third-party action. See CONTRIBUTING.md#sign-off-dco.
name: dco

on:
  pull_request:

permissions: read-all

jobs:
  sign-off:
    name: Every commit is signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Signed-off-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          count=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            count=$((count + 1))
            author_email=$(git show -s --format='%ae' "$sha" | tr '[:upper:]' '[:lower:]')
            subject=$(git show -s --format='%s' "$sha")
            signoffs=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | sed '/^$/d')
            if [ -z "$signoffs" ]; then
              echo "::error::${sha:0:12} \"${subject}\" has no Signed-off-by trailer"
              status=1
              continue
            fi
            emails=$(printf '%s\n' "$signoffs" | grep -E '^[^<]*[^<[:space:]][^<]* <[^<>@[:space:]]+@[^<>[:space:]]+>$' \
              | sed -E 's/.*<([^>]+)>$/\1/' | tr '[:upper:]' '[:lower:]' || true)
            if ! printf '%s\n' "$emails" | grep -qxF "$author_email"; then
              echo "::error::${sha:0:12} \"${subject}\": no Signed-off-by matches the author email <${author_email}>"
              status=1
              continue
            fi
            echo "ok  ${sha:0:12} ${subject}"
          done
          echo "checked ${count} commit(s)"
          if [ "$status" -ne 0 ]; then
            echo
            echo "Fix: sign off every commit, e.g. git rebase --signoff ${BASE_SHA} && git push --force-with-lease"
            echo "See CONTRIBUTING.md (\"Sign-off (DCO)\")."
          fi
          exit $status
