# GitHub Pages: the scribb.it mint app demo and, under /playground/, the Signet Playground demo (ADR-0009), both built fully offline (`VITE_DEMO_DEFAULT=1`: simulated wallet, server and
# chain; no third-party requests). Nothing deploys until the owner enables Pages (Settings → Pages → Source:
# GitHub Actions) AND sets the repository variable PAGES_ENABLED=true (Settings → Variables → Actions).
# Expected URLs: https://degentclub.github.io/scribbit/ and https://degentclub.github.io/scribbit/playground/
name: pages

on:
  push:
    branches: [main]
    paths: ['products/scribbit/apps/mint/**', 'products/scribbit/apps/playground/**', 'products/scribbit/packages/**', 'platform/**', 'pnpm-lock.yaml', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0; pnpm version comes from package.json "packageManager"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: pnpm install --frozen-lockfile

      - name: Build the demo under the Pages base path
        env:
          VITE_DEMO_DEFAULT: '1'
        # base_path is "/scribbit" on degentclub.github.io, "" on a custom domain.
        run: pnpm --filter @bsh/scribbit-mint exec vite build --base "${{ steps.pages.outputs.base_path }}/"

      - name: SPA fallback (unknown paths serve the app)
        run: cp products/scribbit/apps/mint/dist/index.html products/scribbit/apps/mint/dist/404.html

      - name: Build the Signet Playground demo into /playground/
        env:
          VITE_DEMO_DEFAULT: '1'
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}/playground/
        run: |
          pnpm --filter @bsh/scribbit-playground run build --base "${{ steps.pages.outputs.base_path }}/playground/"
          rm -rf products/scribbit/apps/mint/dist/playground
          cp -r products/scribbit/apps/playground/dist products/scribbit/apps/mint/dist/playground

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: products/scribbit/apps/mint/dist

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
