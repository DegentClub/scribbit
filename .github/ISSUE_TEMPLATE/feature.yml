name: Feature request
description: Propose a new capability or a change to existing behaviour in the platform and scribb.it.
title: "<component>: <what you want>"
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas are welcome in [Discussions](https://github.com/DegentClub/scribbit/discussions) first.
        Changes to APIs or events start with the contract in `contracts/`; significant decisions need an ADR.
  - type: input
    id: component
    attributes:
      label: Component
      description: Name from catalog/catalog.json, or "new" for a new component.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you want. Sketch the API or contract change if you have one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contract
    attributes:
      label: Does this change a contract (HTTP API, event, schema)?
      options:
        - "No"
        - "Yes, additive"
        - "Yes, breaking"
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: signing
    attributes:
      label: Does this touch what gets signed, or who holds a key?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself (see CONTRIBUTING.md).
