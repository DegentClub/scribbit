# Component manifest - validated against schemas/component.schema.json by `pnpm validate`.
name: scribbit-mcp
package: "@bsh/scribbit-mcp"
kind: service
product: scribbit
owner: team-scribbit
summary: MCP server "scribb.it - write to Bitcoin" for AI agents - exact inscription quotes, commit addresses, envelope/lane facts, fees and 0x83 self-rescue over Streamable HTTP (API keys) or stdio.
lifecycle: experimental
depends_on: ["@bsh/inscription", "@bsh/scribbit-fee-oracle", "@bsh/edge", "@bsh/scribbit-playground-kit"]
provides: [contracts/openapi/scribbit-mcp.yaml]
consumes: [contracts/openapi/scribbit-fees.yaml]
stores: ["memory:api_keys", "memory:rate_limits"]
secrets: ["services/scribbit-mcp/api-key-hashes"]
env_schema: ./env.schema.json
runbook: ./RUNBOOK.md
docs: ./README.md
slo: { availability: "99.9", p95_ms: 300 }
commands: { dev: dev, test: test, typecheck: typecheck }
