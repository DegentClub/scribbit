openapi: 3.1.0
info:
  title: scribb.it fee oracle
  version: 1.0.0
  summary: Aggregated Bitcoin fee rates for inscription quotes, including the non-standard block lane.
  description: |
    Provided by `scribbit-fee-oracle` (`@bsh/scribbit-fee-oracle`, products/scribbit/packages/fee-oracle).

    The oracle polls several sources (mempool.space-compatible `/api/v1/fees/recommended` and
    `/api/v1/fees/mempool-blocks`, Esplora `/fee-estimates`, bitcoind `estimatesmartfee`, and a Libre Relay
    node for the block lane), normalises them to confirmation targets 1, 3, 6 and 144 blocks, rejects
    outliers (median ± max(3 × 1.4826 × MAD, 25 % of the median), only with 3+ sources), takes the median
    of the rest, floors everything at the configured min relay rate (default 1 sat/vB) and caches the
    aggregate for a TTL (default 30 s).

    `FeesResponse` is a strict superset of the degent.club mint `FeesResponse`
    (contracts/openapi/degent-mint.yaml): `stale` and `sources` are additive, so degent-shaped clients
    can consume this API unchanged.

    Units: fee rates are sat/vB (JSON numbers, may be fractional, rounded UP to 0.1); timestamps are
    ISO 8601 UTC.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local (`pnpm --filter @bsh/scribbit-fee-oracle dev`)
tags:
  - name: fees
paths:
  /v1/fees:
    get:
      tags: [fees]
      operationId: getFees
      summary: Current aggregated fee rates
      parameters:
        - $ref: '#/components/parameters/Network'
      responses:
        '200':
          description: >
            Aggregated fees. `Cache-Control: public, max-age=10` when fresh; `no-store` when `stale` is true.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeesResponse' }
              example:
                network: mainnet
                minFeeRate: 1
                standard: { slow: 1.5, normal: 4, fast: 6.2 }
                block: { min: 1, recommended: 5.1 }
                fetchedAt: '2026-09-23T12:00:00.000Z'
                stale: false
                sources: ['mempool:mempool.space', 'esplora:blockstream.info/api', 'block-lane:192.0.2.227:8332']
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotServed'
        '503':
          description: No source produced usable data and no cached aggregate is young enough to serve.
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/fees/sources:
    get:
      tags: [fees]
      operationId: getFeeSources
      summary: Health of every configured fee source
      description: Polls (at most once per TTL, shared with GET /v1/fees) and reports per-source health.
      parameters:
        - $ref: '#/components/parameters/Network'
      responses:
        '200':
          description: Source health report (returned with 200 even when every source is down).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourcesHealthResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotServed'
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, networks, version]
                properties:
                  status: { const: ok }
                  networks: { type: array, items: { $ref: '#/components/schemas/Network' } }
                  version: { type: string }
components:
  parameters:
    Network:
      name: network
      in: query
      required: false
      description: Network to report; defaults to the first network the server is configured for.
      schema: { $ref: '#/components/schemas/Network' }
  responses:
    BadRequest:
      description: Unknown network name.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotServed:
      description: Valid network that this server is not configured to serve (or unknown route).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Network:
      type: string
      enum: [mainnet, testnet, signet, regtest]
    FeeRate:
      type: number
      exclusiveMinimum: 0
      description: sat/vB
    FeesResponse:
      type: object
      additionalProperties: false
      required: [network, minFeeRate, standard, block, fetchedAt, stale, sources]
      properties:
        network: { $ref: '#/components/schemas/Network' }
        minFeeRate:
          allOf: [{ $ref: '#/components/schemas/FeeRate' }]
          description: Floor for any quote, max(configured min relay, median observed mempool floor).
        standard:
          type: object
          additionalProperties: false
          description: Standard-relay tiers (reveals <= 400,000 WU). Always slow <= normal <= fast, each >= minFeeRate.
          required: [slow, normal, fast]
          properties:
            slow: { $ref: '#/components/schemas/FeeRate' }
            normal: { $ref: '#/components/schemas/FeeRate' }
            fast: { $ref: '#/components/schemas/FeeRate' }
        block:
          type: object
          additionalProperties: false
          description: >
            Block lane (non-standard reveals up to 3,990,000 WU, relayed via Libre Relay / Slipstream).
            `min` = max(minFeeRate, lane floor, observed relay floor); `recommended` = median block-lane
            recommendation (or the configured fallback target) × lane premium, capped, and >= `min`.
          required: [min, recommended]
          properties:
            min: { $ref: '#/components/schemas/FeeRate' }
            recommended: { $ref: '#/components/schemas/FeeRate' }
        fetchedAt: { type: string, format: date-time, description: When the aggregate was assembled from upstream readings. }
        stale: { type: boolean, description: True when served past its TTL because every refresh since has failed. }
        sources: { type: array, items: { type: string }, description: Ids of sources that contributed at least one accepted value. }
    SourceReading:
      type: object
      additionalProperties: false
      properties:
        targets:
          type: object
          additionalProperties: false
          properties:
            '1': { $ref: '#/components/schemas/FeeRate' }
            '3': { $ref: '#/components/schemas/FeeRate' }
            '6': { $ref: '#/components/schemas/FeeRate' }
            '144': { $ref: '#/components/schemas/FeeRate' }
        minRelay: { $ref: '#/components/schemas/FeeRate' }
        block:
          type: object
          additionalProperties: false
          properties:
            min: { $ref: '#/components/schemas/FeeRate' }
            recommended: { $ref: '#/components/schemas/FeeRate' }
    SourceHealth:
      type: object
      additionalProperties: false
      required: [id, kind, ok, stale, lastAttemptAt, lastSuccessAt, lastError, latencyMs, consecutiveFailures, outliers, lastReading]
      properties:
        id: { type: string }
        kind: { enum: [mempool-recommended, mempool-blocks, esplora, bitcoind, block-lane, static] }
        ok: { type: boolean, description: Last attempt succeeded. }
        stale: { type: boolean, description: No success within the staleness window (or never). }
        lastAttemptAt: { type: [string, 'null'], format: date-time }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        latencyMs: { type: [integer, 'null'] }
        consecutiveFailures: { type: integer, minimum: 0 }
        outliers:
          type: array
          items: { type: string }
          description: Values rejected in the last aggregation, e.g. "target:1", "minRelay", "block.recommended".
        lastReading:
          oneOf:
            - { $ref: '#/components/schemas/SourceReading' }
            - { type: 'null' }
    SourcesHealthResponse:
      type: object
      additionalProperties: false
      required: [network, status, checkedAt, sources]
      properties:
        network: { $ref: '#/components/schemas/Network' }
        status: { enum: [ok, degraded, down] }
        checkedAt: { type: string, format: date-time }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceHealth' } }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { enum: [bad_request, not_found, fees_unavailable, internal] }
            message: { type: string }
            details: {}
